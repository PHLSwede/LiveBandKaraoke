<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Purple Sandwich Presents</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,900;1,700&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap');

  :root{
    --black: #0b0508;
    --grape: #3a1235;
    --violet: #5b2a72;
    --mauve: #b98fc9;
    --cream: #f3e9d7;
    --hot: #e0559b;
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0; padding:0;
    background: var(--black);
    font-family: 'Space Grotesk', sans-serif;
    color: var(--cream);
  }

  .poster{
    width: 1080px;
    margin: 0 auto;
    background: var(--black);
    position: relative;
    overflow: hidden;
  }

  /* ---------- HERO ---------- */
  .hero{
    position: relative;
    height: 780px;
    overflow: hidden;
  }

  .hero img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 25%;
    filter: grayscale(1) contrast(1.15) brightness(0.85);
    display:block;
  }

  .hero::after{
    content:"";
    position:absolute; inset:0;
    background:
      linear-gradient(180deg, rgba(11,5,8,0.15) 0%, rgba(11,5,8,0.55) 68%, var(--black) 100%),
      linear-gradient(120deg, rgba(91,42,114,0.75), rgba(224,85,155,0.35) 55%, rgba(58,18,53,0.85));
    mix-blend-mode: multiply;
  }
  .hero-tint{
    position:absolute; inset:0;
    background: linear-gradient(135deg, rgba(91,42,114,0.55), rgba(224,85,155,0.28) 50%, rgba(58,18,53,0.6));
    mix-blend-mode: color;
  }

  .eyebrow-row{
    position:absolute; top: 44px; left: 0; right:0;
    display:flex; justify-content:center;
    z-index: 3;
  }
  .eyebrow{
    font-family:'Space Mono', monospace;
    letter-spacing: 0.42em;
    font-size: 13px;
    color: var(--mauve);
    background: rgba(11,5,8,0.55);
    padding: 8px 20px;
    border: 1px solid rgba(185,143,201,0.4);
  }

  .title-wrap{
    position:absolute;
    bottom: 46px; left: 0; right:0;
    z-index: 3;
    text-align:center;
    padding: 0 40px;
  }

  .presents{
    font-family:'Space Mono', monospace;
    font-size: 15px;
    letter-spacing: 0.5em;
    color: var(--hot);
    margin-bottom: 14px;
  }

  h1{
    font-family:'Playfair Display', serif;
    font-weight: 900;
    font-style: italic;
    font-size: 108px;
    line-height: 0.92;
    margin: 0;
    color: var(--cream);
    text-shadow: 0 6px 40px rgba(0,0,0,0.6);
  }
  h1 span{
    display:block;
    color: var(--hot);
    -webkit-text-stroke: 0;
  }

  .subline{
    margin-top: 18px;
    font-family:'Space Grotesk', sans-serif;
    font-weight: 500;
    font-size: 20px;
    letter-spacing: 0.06em;
    color: var(--mauve);
  }

  /* ---------- DETAILS BAR ---------- */
  .details{
    display:flex;
    justify-content: center;
    gap: 48px;
    padding: 30px 40px;
    background: linear-gradient(90deg, var(--grape), var(--violet));
    border-top: 1px solid rgba(243,233,215,0.15);
    border-bottom: 1px solid rgba(243,233,215,0.15);
  }
  .detail{
    text-align:center;
  }
  .detail .label{
    font-family:'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.28em;
    color: var(--mauve);
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .detail .value{
    font-family:'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 19px;
    color: var(--cream);
  }

  /* ---------- SETLIST ---------- */
  .setlist{
    padding: 56px 64px 20px;
  }
  .setlist-header{
    text-align:center;
    margin-bottom: 34px;
  }
  .setlist-header .kicker{
    font-family:'Space Mono', monospace;
    letter-spacing: 0.35em;
    font-size: 12px;
    color: var(--hot);
    margin-bottom: 10px;
  }
  .setlist-header h2{
    font-family:'Playfair Display', serif;
    font-style: italic;
    font-weight: 700;
    font-size: 40px;
    margin: 0;
    color: var(--cream);
  }

  .columns{
    display:flex;
    gap: 48px;
  }
  .col{ flex:1; }

  .song{
    display:flex;
    align-items: baseline;
    gap: 12px;
    padding: 11px 0;
    border-bottom: 1px solid rgba(243,233,215,0.1);
  }
  .num{
    font-family:'Space Mono', monospace;
    color: var(--hot);
    font-size: 15px;
    font-weight: 700;
    width: 26px;
    flex-shrink: 0;
  }
  .song-text{
    font-size: 15.5px;
    line-height: 1.4;
  }
  .song-title{
    font-weight: 600;
    color: var(--cream);
  }
  .song-artist{
    color: var(--mauve);
    font-style: italic;
  }
  .song-singer{
    font-family:'Space Mono', monospace;
    font-size: 12px;
    color: rgba(243,233,215,0.55);
    letter-spacing: 0.02em;
  }

  /* ---------- FOOTER ---------- */
  .footer{
    margin-top: 30px;
    padding: 26px 40px 44px;
    text-align:center;
    background: radial-gradient(ellipse at 50% 0%, rgba(91,42,114,0.35), transparent 70%);
  }
  .footer-badge{
    display:inline-flex;
    align-items:center;
    gap: 14px;
    font-family:'Space Mono', monospace;
    letter-spacing: 0.15em;
    font-size: 16px;
    color: var(--cream);
    background: var(--grape);
    border: 1px solid var(--mauve);
    padding: 12px 30px;
  }
  .footer-badge .dot{ color: var(--hot); }
</style>
</head>
